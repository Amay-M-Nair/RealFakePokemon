# Render blueprint. Free tier: 512MB RAM, spins down after 15 min idle
# (30-60s cold start on the next request).
services:
  - type: web
    name: neural-pokedex
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: GENERATOR_THREADS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: neural-pokedex-db
          property: connectionString

databases:
  - name: neural-pokedex-db
    plan: free
