{% if results %}
<div class="grid">
  {% for r in results %}
  <figure class="card">
    <a href="{{ r.url }}" target="_blank" rel="noopener"
       title="Permalink — this seed always renders this image">
      <img alt="Generated creature, seed {{ r.seed }}" src="{{ r.url }}">
    </a>
    <figcaption>
      <span class="seed">#{{ r.seed }}</span>
      <span class="actions">
        <a class="chip" href="{{ r.url }}?bg=transparent" download
           title="Transparent PNG">png</a>
        <button class="chip chip--like"
                hx-post="{% url 'generator:like' seed=r.seed psi=r.psi_pct %}"
                hx-swap="outerHTML">♥</button>
      </span>
    </figcaption>
  </figure>
  {% endfor %}
</div>
{% else %}
<p class="empty">Nothing generated.</p>
{% endif %}
